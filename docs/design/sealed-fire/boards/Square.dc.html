<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Alegreya:ital,wght@0,400;0,500;1,400&family=UnifrakturMaguntia&display=swap">
  <style>
    body { margin: 0; background: #0A0B10; }
    a { color: #D97F1F; } a:hover { color: #F5A83C; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(80% 45% at 50% 30%, #4a3212 0%, #1e150c 55%, #0A0B10 100%); color: #EDE4D3; font-family: 'Alegreya', Georgia, serif; display: flex; flex-direction: column; padding: 56px 20px 0 20px; gap: 14px;">
  <div style="display: flex; flex-direction: row; align-items: center; gap: 10px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D97F1F" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 2v2M8 6h8l-1 9H9z"></path><path d="M7 15h10M9 21h6M12 15v6"></path></svg>
    <div style="font-family: 'Yeseva One', Georgia, serif; font-size: 22px; letter-spacing: 1px; color: #EDE4D3;">The Square</div>
  </div>
  <div style="font-size: 15px; line-height: 1.4; color: #8F97A3; font-style: italic;">Gates close at the lantern-lighting. Seven lanterns lit so far, yours among them.</div>

  <div style="position: relative; height: 470px; border-radius: 10px; border: 1px solid #5C4720; background: radial-gradient(60% 50% at 50% 50%, #3b2a12 0%, #1e150c 60%, #12141C 100%); overflow: hidden;">
    <svg width="350" height="470" viewBox="0 0 350 470" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
      <defs>
        <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F5A83C" stop-opacity="0.9"></stop><stop offset="60%" stop-color="#F5A83C" stop-opacity="0.25"></stop><stop offset="100%" stop-color="#F5A83C" stop-opacity="0"></stop></radialGradient>
        <pattern id="cobble" width="22" height="14" patternUnits="userSpaceOnUse"><ellipse cx="11" cy="7" rx="9" ry="5" fill="none" stroke="#5C4720" stroke-opacity="0.35" stroke-width="1"></ellipse></pattern>
      </defs>
      <rect x="0" y="0" width="350" height="470" fill="url(#cobble)"></rect>
      <rect x="40" y="40" width="270" height="390" fill="none" stroke="#5C4720" stroke-width="2" stroke-dasharray="6 6"></rect>
      <path d="M150 40h50M150 430h50" stroke="#D97F1F" stroke-width="4"></path>
      <text x="175" y="30" text-anchor="middle" font-family="Yeseva One, Georgia, serif" font-size="10" letter-spacing="2" fill="#8F97A3">NORTH GATE</text>
      <text x="175" y="452" text-anchor="middle" font-family="Yeseva One, Georgia, serif" font-size="10" letter-spacing="2" fill="#8F97A3">SOUTH GATE</text>
      <circle cx="175" cy="235" r="16" fill="#2a1a10" stroke="#B8923F" stroke-width="3"></circle>
      <path d="M175 219v-10M175 209l6 6M175 209l-6 6" stroke="#B8923F" stroke-width="3" stroke-linecap="round"></path>
      <text x="175" y="272" text-anchor="middle" font-family="Yeseva One, Georgia, serif" font-size="10" letter-spacing="2" fill="#B8923F">THE BELL</text>

      <g><circle cx="90" cy="110" r="34" fill="url(#lamp)"></circle><rect x="84" y="102" width="12" height="16" fill="#F5A83C"></rect><path d="M82 102h16M82 118h16" stroke="#5C4720" stroke-width="2"></path></g>
      <g><circle cx="260" cy="120" r="34" fill="url(#lamp)"></circle><rect x="254" y="112" width="12" height="16" fill="#F5A83C"></rect><path d="M252 112h16M252 128h16" stroke="#5C4720" stroke-width="2"></path></g>
      <g><circle cx="70" cy="330" r="34" fill="url(#lamp)"></circle><rect x="64" y="322" width="12" height="16" fill="#F5A83C"></rect><path d="M62 322h16M62 338h16" stroke="#5C4720" stroke-width="2"></path></g>
      <g><circle cx="280" cy="340" r="34" fill="url(#lamp)"></circle><rect x="274" y="332" width="12" height="16" fill="#F5A83C"></rect><path d="M272 332h16M272 348h16" stroke="#5C4720" stroke-width="2"></path></g>
      <g><circle cx="175" cy="380" r="40" fill="url(#lamp)"></circle><rect x="169" y="372" width="12" height="16" fill="#F5A83C"></rect><path d="M167 372h16M167 388h16" stroke="#EE2B75" stroke-width="2.5"></path><text x="175" y="412" text-anchor="middle" font-family="Yeseva One, Georgia, serif" font-size="10" letter-spacing="2" fill="#EE2B75">YOU</text></g>
      <g><circle cx="120" cy="200" r="30" fill="url(#lamp)"></circle><rect x="114" y="192" width="12" height="16" fill="#F5A83C"></rect><path d="M112 192h16M112 208h16" stroke="#5C4720" stroke-width="2"></path></g>
      <g><circle cx="240" cy="290" r="30" fill="url(#lamp)"></circle><rect x="234" y="282" width="12" height="16" fill="#F5A83C"></rect><path d="M232 282h16M232 298h16" stroke="#5C4720" stroke-width="2"></path></g>
      <g opacity="0.35"><rect x="214" y="172" width="12" height="16" fill="#26303B"></rect><path d="M212 172h16M212 188h16" stroke="#5C4720" stroke-width="2"></path></g>
      <g opacity="0.35"><rect x="124" y="292" width="12" height="16" fill="#26303B"></rect><path d="M122 292h16M122 308h16" stroke="#5C4720" stroke-width="2"></path></g>
    </svg>
  </div>

  <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;"><div style="font-family: 'Yeseva One', Georgia, serif; font-size: 13px; letter-spacing: 1.5px; color: #8F97A3;">FIRST BELL</div><div style="font-size: 16px; color: #EDE4D3;">Tomorrow, one o'clock</div></div>
    <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end;"><div style="font-family: 'Yeseva One', Georgia, serif; font-size: 13px; letter-spacing: 1.5px; color: #8F97A3;">ROUNDS</div><div style="font-size: 16px; color: #EDE4D3;">Four, a bell each</div></div>
  </div>
  <div style="height: 50px; display: flex; align-items: center; font-size: 16px; color: #8F97A3; text-decoration: underline; text-decoration-color: #394553; text-underline-offset: 4px;">Put out my lantern</div>
</div>
</x-dc>
</body>
</html>
