# The keepers' panel (/) and the Guild House web page (/guild/), static files from scripts/deploy.sh.
server {
  listen 127.0.0.1:8081;
  root /opt/mingldingl/web;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  # The Guild House web page is its own app.
  location /guild/ {
    try_files $uri $uri/ /guild/index.html;
  }
  # Built assets never change under one name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # The panel routes in the browser.
  location / {
    try_files $uri /index.html;
  }
}
