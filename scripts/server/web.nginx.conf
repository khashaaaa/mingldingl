# The keepers' panel (/), the Guild House web page (/guild/) and the legal pages, static files from scripts/deploy.sh.
server {
  listen 127.0.0.1:8081;
  root /opt/mingldingl/web;
  # No page here may be framed (clickjacking the panel). A location with its own add_header drops
  # these, so /assets/ repeats them. No script-src: the CSP only forbids framing, plugins and <base>.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

  # The Guild House web page is its own app.
  location /guild/ {
    try_files $uri $uri/ /guild/index.html;
  }
  # Built assets never change under one name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  }
  # The pages the stores link to: /privacy/, /terms/, /delete/, /safety/.
  location ~ ^/(privacy|terms|delete|safety)/?$ {
    try_files /$1/index.html =404;
  }
  # The panel routes in the browser.
  location / {
    try_files $uri /index.html;
  }
}
