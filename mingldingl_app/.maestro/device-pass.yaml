# The device pass (run by device-pass.sh): every foundation screen (sign-in, onboarding, Character,
# Edit) in the state its Figma frame shows, one screenshot each, named ${LOCALE}-<frame id>. Taps
# match the English or the Mongolian line, so the same flow runs in both.
#   Needs scripts/dev.sh (fake WeSend: every code is 000000, 99000001's expires) and the seed album.
appId: com.mingldingl.app
env:
  METRO_URL: http%3A%2F%2F192.168.1.32%3A8081
  # LOCALE (en | mn) comes from device-pass.sh: a default here would win over the -e value.
---
- launchApp:
    clearState: true
    stopApp: true
    permissions: { location: deny }   # Maestro grants everything otherwise; 23:810 is the refusal
- runFlow: _launch.yaml
- runFlow:
    when:
      true: ${LOCALE == 'mn'}
    commands:
      - tapOn: Монгол хэл
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-23-6

- tapOn: Enter the Gate|Дааман хаалгаар орох
- extendedWaitUntil: { visible: 'Prove your number|Дугаараа баталгаажуулах', timeout: 10000 }
- tapOn: Phone number|Утасны дугаар
- inputText: '8858'
- takeScreenshot: ${LOCALE}-23-68

- eraseText: 8
- inputText: '99000000'
- tapOn: Continue|Үргэлжлүүлэх
- extendedWaitUntil: { visible: 'Speak the code|Кодоо хэл', timeout: 15000 }
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-23-141

- runFlow: { file: _keys-away.yaml, env: { AT: 'Speak the code|Кодоо хэл' } }
- tapOn: Use another number|Өөр дугаар ашиглах
- tapOn: Phone number|Утасны дугаар
- eraseText: 8
- inputText: '99000001'
- tapOn: Continue|Үргэлжлүүлэх
- runFlow: _code.yaml
- extendedWaitUntil: { visible: 'That code expired|Кодын хугацаа дууслаа', timeout: 20000 }
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-23-285

- tapOn: Back|Буцах
- tapOn: Phone number|Утасны дугаар
- eraseText: 8
- inputText: ${PHONE}
- tapOn: Continue|Үргэлжлүүлэх
- runFlow: _code.yaml
# "The gate opens" holds for ceremonyMin (1.2 s); Maestro's inputText often returns after it is
# gone, so its frame is caught when it can be and never fails the pass.
- runFlow:
    when:
      visible: 'The gate opens|Хаалга нээгдэж байна'
    commands:
      - takeScreenshot: ${LOCALE}-23-216

- extendedWaitUntil: { visible: 'What does the hold call you\?|Цайзад чамайг хэн гэж дуудах вэ\?', timeout: 15000 }
- tapOn: First name|Нэр
- inputText: Munkhbold
- pressKey: Enter
- inputText: '14031995'
- runFlow: { file: _keys-away.yaml, env: { AT: 'What does the hold call you\?|Цайзад чамайг хэн гэж дуудах вэ\?' } }
- takeScreenshot: ${LOCALE}-23-359

- tapOn: Continue|Үргэлжлүүлэх
- extendedWaitUntil: { visible: 'You are…|Чи бол…', timeout: 10000 }
- tapOn: A man|Эрэгтэй
- takeScreenshot: ${LOCALE}-23-442
- tapOn: { text: Continue|Үргэлжлүүлэх, optional: true }

- extendedWaitUntil: { visible: 'Your portraits|Чиний хөргүүд', timeout: 10000 }
- runFlow: { file: _pick-portraits.yaml, env: { COUNT: 2 } }
- extendedWaitUntil: { visible: '(?i)(2 of 3 needed|2 / 3 хэрэгтэй).*', timeout: 60000 }
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-23-530
- runFlow: { file: _pick-portraits.yaml, env: { COUNT: 1 } }
- extendedWaitUntil: { visible: '(?i)(3 of 3 needed|3 / 3 хэрэгтэй).*', timeout: 60000 }
- tapOn: Continue|Үргэлжлүүлэх

- extendedWaitUntil: { visible: 'Your tale|Чиний домог', timeout: 10000 }
- runFlow: { file: _type-tale.yaml, env: { TEXT: 'I keep a falcon and read old maps by candlelight. Looking for someone who knows the valleys.' } }
- runFlow: { file: _keys-away.yaml, env: { AT: 'Your tale|Чиний домог' } }
- tapOn: Where do you live\?|Хаана амьдардаг вэ\?
- tapOn: Ulaanbaatar|Улаанбаатар
- tapOn: Bayangol|Баянгол
- takeScreenshot: ${LOCALE}-23-624

- tapOn: Where do you live\?|Хаана амьдардаг вэ\?
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-23-707
- tapOn: Use my location|Байршлаа ашиглах
- tapOn: { text: "Don.t allow|Deny", optional: true }   # 'deny' still lets the app ask once
- tapOn: Search a city or soum|Хот эсвэл сум хайх
- inputText: Erd
- scroll     # dragging the list puts the keys away, as in the frame
- takeScreenshot: ${LOCALE}-23-810
- tapOn: Back|Буцах

- tapOn: Continue|Үргэлжлүүлэх
- extendedWaitUntil: { visible: 'Swear your oath|Тангаргаа өргө', timeout: 10000 }
- tapOn: Bond|Холбоо
- takeScreenshot: ${LOCALE}-23-881
- tapOn: Swear the oath|Тангараг өргөх
- extendedWaitUntil: { visible: 'Your tale is written in full\.|Чиний домог бүрэн бичигдлээ\.', timeout: 10000 }
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-23-973

- tapOn: Enter the Hearth|Гал голомтод орох
# Finishing lands in Seek; Character is its own tab, and Edit sits in its War Room (⋮).
- extendedWaitUntil: { visible: Character|Баатар, timeout: 15000 }
- tapOn: Character|Баатар
- extendedWaitUntil: { visible: Your Oath|Тангараг, timeout: 10000 }
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-26-1029
- tapOn: The War Room|Дайны танхим
- extendedWaitUntil: { visible: Edit your character|Баатраа засах, timeout: 10000 }
- tapOn: Edit your character|Баатраа засах
- extendedWaitUntil: { visible: First name|Нэр, timeout: 10000 }
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-35-183
- tapOn: Back|Буцах
