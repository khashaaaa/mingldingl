# Subflow: type ${TEXT} into the tale. The field is picked by its own label ("Your tale") below the
# YOUR TALE caption — position alone also matches the "0 / 300" counter and, on the A51, Samsung's
# Edge-panel handle at the same height. Keys typed with no field focused reach the activity, where
# a development build reloads on two quick R presses.
appId: com.mingldingl.app
---
- tapOn: { text: 'Your tale|Чиний домог', below: 'YOUR TALE|ЧИНИЙ ДОМОГ' }
- runFlow:
    when:
      notVisible: { text: 'Your tale|Чиний домог', below: 'YOUR TALE|ЧИНИЙ ДОМОГ', focused: true }
    commands:
      - waitForAnimationToEnd: { timeout: 1500 }
      - tapOn: { text: 'Your tale|Чиний домог', below: 'YOUR TALE|ЧИНИЙ ДОМОГ' }
- assertVisible: { text: 'Your tale|Чиний домог', below: 'YOUR TALE|ЧИНИЙ ДОМОГ', focused: true }
- inputText: ${TEXT}
