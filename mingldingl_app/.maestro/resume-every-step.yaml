# Kill and relaunch on every onboarding step: each relaunch lands on the step it was killed on,
# with what was already given kept (the step is derived from the profile on the engine).
appId: com.mingldingl.app
env:
  METRO_URL: http%3A%2F%2F192.168.1.32%3A8081
---
- runFlow: _to-name.yaml
- runFlow: { file: _relaunch.yaml, env: { EXPECT: 'What does the hold call you\?' } }
- tapOn: First name
- inputText: Maestro
- pressKey: Enter
- inputText: "12041998"
- tapOn: Continue
- extendedWaitUntil: { visible: 'You are…', timeout: 10000 }
- runFlow: { file: _relaunch.yaml, env: { EXPECT: 'You are…' } }
- tapOn: A man
- tapOn: { text: Continue, optional: true }
- extendedWaitUntil: { visible: 'Your portraits', timeout: 10000 }
- runFlow: { file: _relaunch.yaml, env: { EXPECT: 'Your portraits' } }
- assertVisible: (?i)0 of 3 needed.*
- runFlow: { file: _pick-portraits.yaml, env: { COUNT: 3 } }
- extendedWaitUntil: { visible: '(?i)3 of 3 needed.*', timeout: 60000 }
- tapOn: Continue
- extendedWaitUntil: { visible: 'Your tale', timeout: 10000 }
- runFlow: { file: _relaunch.yaml, env: { EXPECT: 'Your tale' } }
- waitForAnimationToEnd   # just relaunched: typing before the step settles lands nowhere
- runFlow: { file: _type-tale.yaml, env: { TEXT: 'Relaunched at every step.' } }
- runFlow: { file: _keys-away.yaml, env: { AT: 'Your tale' } }
- tapOn: Where do you live\?
- tapOn: Ulaanbaatar      # the capital opens to its districts
- tapOn: Khan-Uul
- tapOn: Continue
- extendedWaitUntil: { visible: 'Swear your oath', timeout: 10000 }
- runFlow: { file: _relaunch.yaml, env: { EXPECT: 'Swear your oath' } }
- tapOn: Bond
- tapOn: Swear the oath
- extendedWaitUntil: { visible: 'Your tale is written in full\.', timeout: 10000 }
- runFlow: { file: _relaunch.yaml, env: { EXPECT: 'Your tale is written in full\.' } }
- tapOn: Enter the Hearth
- extendedWaitUntil: { visible: 'Character', timeout: 15000 }
- runFlow: { file: _relaunch.yaml, env: { EXPECT: 'Character' } }
- assertVisible: Maestro, 28
