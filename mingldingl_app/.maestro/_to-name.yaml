# Subflow: a fresh install signs up a new number (the fake WeSend's code 000000) and stops on
# onboarding step 1 (name and birth date). Leaves the number in ${output.phone}.
appId: com.mingldingl.app
---
- launchApp:
    clearState: true
    stopApp: true
- runFlow: _launch.yaml
- tapOn: Enter the Gate
- extendedWaitUntil:
    visible: Prove your number
    timeout: 10000
- runScript: scripts/phone.js
- tapOn: Phone number
- inputText: ${output.phone}
- tapOn: Continue
- runFlow: _code.yaml
- extendedWaitUntil:
    visible: What does the hold call you\?
    timeout: 15000
