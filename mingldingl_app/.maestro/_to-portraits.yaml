# Subflow: a fresh install signs up a new number (_to-name.yaml) and walks onboarding steps 1–2,
# stopping on step 3 (portraits). Leaves the number in ${output.phone}.
appId: com.mingldingl.app
---
- runFlow: _to-name.yaml
- tapOn: First name
- inputText: Maestro
- pressKey: Enter        # the keyboard's Next: on a short screen Born is under the keyboard until focused
- inputText: "12041998"
# no hideKeyboard: it presses Back, and on Samsung's number pad a second Back leaves the app.
# Continue rides above the keyboard.
- tapOn: Continue
- tapOn: A man
- tapOn:
    text: Continue
    optional: true
- extendedWaitUntil:
    visible: Your portraits
    timeout: 10000
