# Every text field with its keyboard up, screenshotted: the field, its label and the action that
# follows it (Continue, Save, the next field) must all show above the keys. Read the shots in
# ~/.maestro/tests/<run>/ (or the cwd) — Maestro cannot tell a view drawn under the keyboard from one above it.
#   maestro --device emulator-5554 test .maestro/keyboard-clear.yaml
appId: com.mingldingl.app
env:
  METRO_URL: http%3A%2F%2F192.168.1.32%3A8081
---
- launchApp: { clearState: true, stopApp: true }
- runFlow: _launch.yaml
- tapOn: Enter the Gate
- extendedWaitUntil: { visible: 'Prove your number', timeout: 10000 }
- runScript: scripts/phone.js
- tapOn: Phone number
- takeScreenshot: kb-1-phone
- inputText: ${output.phone}
- tapOn: Continue
- runFlow: _code.yaml
- extendedWaitUntil: { visible: 'What does the hold call you\?', timeout: 15000 }
- tapOn: First name
- takeScreenshot: kb-2-name
- inputText: Maestro
- pressKey: Enter
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: kb-3-born   # Born focused; adb Enter leaves its number pad down, the real Next key opens it
- inputText: "12041998"
- tapOn: Continue
- tapOn: A man
- tapOn: { text: Continue, optional: true }
- extendedWaitUntil: { visible: 'Your portraits', timeout: 10000 }
- runFlow: { file: _pick-portraits.yaml, env: { COUNT: 3 } }
- extendedWaitUntil: { visible: '(?i)3 of 3 needed.*', timeout: 60000 }
- tapOn: Continue
- extendedWaitUntil: { visible: 'Your tale', timeout: 10000 }
- runFlow: { file: _type-tale.yaml, env: { TEXT: "A long tale, line after line,\nso the box grows\nand grows\nand grows\nuntil it would reach the keys." } }
- takeScreenshot: kb-4-tale
- runFlow: { file: _keys-away.yaml, env: { AT: 'Your tale' } }
- tapOn: Where do you live\?
- tapOn: Search a city or soum
- takeScreenshot: kb-5-city-search
- scroll
- scroll
- takeScreenshot: kb-6-city-bottom
- tapOn: Search a city or soum   # dragging the list put the keyboard away
- inputText: uul
- assertVisible: uul     # every key arrives (a controlled field in the overlay once lost the first)
- takeScreenshot: kb-7-city-found
- tapOn: Khan-Uul
- tapOn: Continue
- extendedWaitUntil: { visible: 'Swear your oath', timeout: 10000 }
- tapOn: Bond
- tapOn: Swear the oath
- extendedWaitUntil: { visible: 'Your tale is written in full\.', timeout: 10000 }
- tapOn: Enter the Hearth
# Character is its own tab, and Edit sits in its War Room (⋮).
- extendedWaitUntil: { visible: 'Character', timeout: 15000 }
- tapOn: Character
- extendedWaitUntil: { visible: 'Your Oath', timeout: 10000 }
- tapOn: The War Room
- extendedWaitUntil: { visible: 'Edit your character', timeout: 10000 }
- tapOn: Edit your character
- tapOn: First name
- takeScreenshot: kb-8-edit-name
- runFlow: { file: _keys-away.yaml, env: { AT: 'Hold a portrait to lift it.*' } }
- tapOn: { text: 'A long tale.*' }
- takeScreenshot: kb-9-edit-tale
