services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - Supabase__JwtSecret=${SUPABASE_JWT_SECRET}
      - Supabase__ProjectUrl=${SUPABASE_PROJECT_URL}
      - Agora__AppId=${AGORA_APP_ID}
      - Agora__AppCertificate=${AGORA_APP_CERTIFICATE}
    restart: unless-stopped
